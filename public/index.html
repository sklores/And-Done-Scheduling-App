<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift — Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --border: #d9d5cc;
      --text: #1a1916;
      --text-muted: #6b6860;
      --accent: #c84b2f;
      --green: #2d5a27;
      --header-bg: #1a1916;
      --radius: 3px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --rowH: 84px;

      /* Role colors */
      --role-manager: #1e4db7;
      --role-server: #6b3fa0;
      --role-cook: #a83228;
      --role-cashier: #2d7a3a;
      --role-host: #6b6b2a;
      --role-barista: #1a7a7a;
      --role-default: #555;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #login-screen .logo {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    #login-screen .subtitle {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 320px;
    }

    .login-box label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .login-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 14px;
      outline: none;
    }

    .login-box input:focus {
      border-color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      white-space: nowrap;
    }

    .btn:hover { border-color: var(--text); }

    .btn.primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
      width: 100%;
      font-size: 13px;
      padding: 11px 16px;
    }

    .btn.primary:hover { background: #2d2b27; }

    .btn.danger {
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn.danger:hover {
      background: #fdf0ed;
    }

    .login-error {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      margin-top: 10px;
      display: none;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      color: #fff;
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    header .logo {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-right: 4px;
    }

    header .business-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-right: 16px;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-nav button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: var(--radius);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .week-nav button:hover { background: rgba(255,255,255,0.2); }

    .week-label {
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      min-width: 160px;
      text-align: center;
    }

    .header-spacer { flex: 1; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: var(--radius);
      background: transparent;
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .header-btn:hover { background: rgba(255,255,255,0.1); }

    .header-btn.accent-btn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .header-btn.accent-btn:hover { background: #b8401f; }

    /* ── STATS BAR ── */
    .stats-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 28px;
      align-items: center;
      flex-shrink: 0;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    /* ── SCHEDULE GRID ── */
    .schedule-wrapper {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 200px repeat(7, minmax(120px, 1fr));
      min-width: 1040px;
    }

    /* Header row cells */
    .grid-corner {
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      left: 0;
      z-index: 4;
    }

    .day-header {
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .day-header .day-name {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .day-header .day-num {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
    }

    .day-header .day-num.today {
      color: var(--accent);
    }

    .day-header .day-stats {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Employee column cell */
    .emp-cell {
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: var(--rowH);
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .emp-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }

    .emp-info {
      flex: 1;
      min-width: 0;
    }

    .emp-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .emp-role {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .emp-week-stats {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Shift cells */
    .shift-cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 6px;
      height: var(--rowH);
      position: relative;
      background: var(--bg);
      cursor: pointer;
    }

    .shift-cell:hover {
      background: #edeae4;
    }

    .shift-block {
      border-radius: var(--radius);
      padding: 4px 7px;
      font-family: var(--mono);
      font-size: 10px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 3px;
      position: relative;
      overflow: hidden;
    }

    .shift-block:last-child { margin-bottom: 0; }

    .shift-block .shift-time {
      font-weight: 600;
      font-size: 11px;
      white-space: nowrap;
    }

    .shift-block .shift-notes {
      font-size: 9px;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shift-cell .add-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.1);
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s;
      line-height: 1;
    }

    .shift-cell:hover .add-btn { opacity: 1; }

    /* ── MODALS ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .modal-lg {
      max-width: 600px;
    }

    .modal-title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text);
    }

    .form-row {
      margin-bottom: 14px;
    }

    .form-row label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: var(--text);
    }

    .form-row textarea {
      resize: vertical;
      min-height: 60px;
      font-family: var(--sans);
    }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ── STAFF DRAWER ── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 50;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 51;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.2s ease;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .drawer-title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
    }

    .drawer-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .staff-list {
      margin-bottom: 24px;
    }

    .staff-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .staff-item:last-child { border-bottom: none; }

    .staff-item-info { flex: 1; min-width: 0; }

    .staff-item-name {
      font-size: 13px;
      font-weight: 600;
    }

    .staff-item-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .staff-item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      cursor: pointer;
    }

    .icon-btn:hover { border-color: var(--text); color: var(--text); }

    .icon-btn.danger:hover { border-color: var(--accent); color: var(--accent); }

    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* color picker row */
    .color-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.1s;
    }

    .color-dot.selected {
      border-color: var(--text);
    }

    /* Publish modal */
    .publish-employee-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .publish-employee-row:last-child { border-bottom: none; }

    .publish-emp-info { flex: 1; min-width: 0; }

    .publish-emp-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .publish-emp-phone {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .publish-emp-preview {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .publish-status {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: var(--radius);
      flex-shrink: 0;
    }

    .publish-status.sent { background: #e8f5e9; color: var(--green); }
    .publish-status.failed { background: #fdecea; color: var(--accent); }
    .publish-status.no-phone { background: var(--bg); color: var(--text-muted); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 20px;
      border-radius: var(--radius);
      z-index: 9999;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="logo">shift</div>
  <div class="subtitle">GCDC · Manager</div>
  <div class="login-box">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" />
    <button class="btn primary" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password</div>
  </div>
  <button id="demo-btn" style="margin-top:20px;background:none;border:none;font-family:var(--mono);font-size:11px;color:var(--text-muted);cursor:pointer;text-decoration:underline;">Preview with sample data</button>
</div>

<!-- HEADER -->
<header id="app-header" class="hidden">
  <span class="logo">shift</span>
  <span class="business-tag">GCDC</span>
  <div class="week-nav">
    <button id="prev-week" title="Previous week">&#8592;</button>
    <span class="week-label" id="week-label">—</span>
    <button id="next-week" title="Next week">&#8594;</button>
  </div>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <button class="header-btn" id="manage-staff-btn">Manage Staff</button>
    <button class="header-btn accent-btn" id="publish-btn">Publish Schedule</button>
  </div>
</header>

<!-- STATS BAR -->
<div class="stats-bar hidden" id="stats-bar">
  <div class="stat">
    <span class="stat-label">Labor Cost</span>
    <span class="stat-value" id="stat-cost">$0.00</span>
  </div>
  <div class="stat">
    <span class="stat-label">Total Hours</span>
    <span class="stat-value" id="stat-hours">0h</span>
  </div>
  <div class="stat">
    <span class="stat-label">Shifts</span>
    <span class="stat-value" id="stat-shifts">0</span>
  </div>
</div>

<!-- SCHEDULE GRID WRAPPER -->
<div class="schedule-wrapper hidden" id="schedule-wrapper">
  <div class="schedule-grid" id="schedule-grid"></div>
</div>

<!-- ── STAFF DRAWER ── -->
<div class="drawer-overlay hidden" id="drawer-overlay"></div>
<div class="drawer" id="staff-drawer">
  <div class="drawer-header">
    <span class="drawer-title">Manage Staff</span>
    <button class="drawer-close" id="drawer-close">&#x2715;</button>
  </div>
  <div class="drawer-body">
    <div class="section-label">Active Employees</div>
    <div class="staff-list" id="staff-list"></div>

    <div class="section-label" id="emp-form-label">Add Employee</div>
    <div id="emp-form">
      <input type="hidden" id="edit-emp-id" />
      <div class="form-row">
        <label>Full Name</label>
        <input type="text" id="emp-name" placeholder="Jane Smith" />
      </div>
      <div class="form-row-2col">
        <div class="form-row">
          <label>Role</label>
          <select id="emp-role">
            <option value="server">Server</option>
            <option value="cook">Cook</option>
            <option value="cashier">Cashier</option>
            <option value="manager">Manager</option>
            <option value="host">Host</option>
            <option value="barista">Barista</option>
          </select>
        </div>
        <div class="form-row">
          <label>Hourly Rate ($)</label>
          <input type="number" id="emp-rate" placeholder="15.00" step="0.01" min="0" />
        </div>
      </div>
      <div class="form-row-2col">
        <div class="form-row">
          <label>4-Digit PIN</label>
          <input type="text" id="emp-pin" placeholder="1234" maxlength="4" pattern="\d{4}" />
        </div>
        <div class="form-row">
          <label>Phone (SMS)</label>
          <input type="tel" id="emp-phone" placeholder="+14155550123" />
        </div>
      </div>
      <div class="form-row">
        <label>Color</label>
        <div class="color-options" id="color-options">
          <!-- rendered by JS -->
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn primary" id="save-emp-btn" style="flex:1;">Save Employee</button>
        <button class="btn hidden" id="cancel-edit-btn">Cancel</button>
      </div>
      <div class="login-error" id="emp-error"></div>
    </div>
  </div>
</div>

<!-- ── SHIFT MODAL ── -->
<div class="modal-overlay hidden" id="shift-modal-overlay">
  <div class="modal">
    <div class="modal-title" id="shift-modal-title">Add Shift</div>
    <input type="hidden" id="shift-id" />
    <input type="hidden" id="shift-employee-id" />
    <input type="hidden" id="shift-date" />
    <div class="form-row">
      <label>Employee</label>
      <input type="text" id="shift-emp-display" readonly style="background:var(--bg);cursor:default;" />
    </div>
    <div class="form-row">
      <label>Date</label>
      <input type="text" id="shift-date-display" readonly style="background:var(--bg);cursor:default;" />
    </div>
    <div class="form-row-2col">
      <div class="form-row">
        <label>Start Time</label>
        <select id="shift-start"></select>
      </div>
      <div class="form-row">
        <label>End Time</label>
        <select id="shift-end"></select>
      </div>
    </div>
    <div class="form-row">

      <textarea id="shift-notes" placeholder="e.g. opening shift, cover for Alex..."></textarea>

</div>

<!-- ── PUBLISH MODAL ── -->
<div class="modal-overlay hidden" id="publish-modal-overlay">
  <div class="modal modal-lg">
    <div class="modal-title">Publish Schedule</div>
    <div id="publish-list"></div>
    <div class="modal-actions">
      <button class="btn" id="cancel-publish-btn">Cancel</button>
      <button class="btn primary" id="send-publish-btn" style="width:auto;">Send SMS</button>
    </div>
    <div class="login-error" id="publish-error"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

// ── CONSTANTS ──
const COLORS = [
  '#c84b2f','#1e4db7','#6b3fa0','#2d7a3a','#6b6b2a','#1a7a7a',
  '#b56c2a','#7a2a5a','#2a6b7a','#4a4a4a'
];

const ROLE_COLORS = {
  manager: '#1e4db7',
  server:  '#6b3fa0',
  cook:    '#a83228',
  cashier: '#2d7a3a',
  host:    '#6b6b2a',
  barista: '#1a7a7a'
};

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── STATE ──
let authToken = sessionStorage.getItem('mgr_token') || '';
let employees = [];
let shifts = [];
let currentWeekStart = getMondayOf(new Date());
let selectedColor = COLORS[0];

// ── UTILS ──
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function fmtDate(date) {
  return `${MONTHS[date.getMonth()]} ${date.getDate()}`;
}

function fmtDateFull(date) {
  return `${DAYS[date.getDay() === 0 ? 6 : date.getDay() - 1]}, ${fmtDate(date)}`;
}

function toDateStr(date) {
  return date.toISOString().split('T')[0];
}

function fmtTime(tsStr) {
  const d = new Date(tsStr);
  const h = d.getHours();
  const m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  return `${h12}:${m.toString().padStart(2, '0')}${ampm}`;
}

function shiftHours(shift) {
  return (new Date(shift.end_ts) - new Date(shift.start_ts)) / 3600000;
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function getRoleColor(role) {
  return ROLE_COLORS[role] || '#555';
}

function isToday(date) {
  const now = new Date();
  return date.getFullYear() === now.getFullYear() &&
         date.getMonth() === now.getMonth() &&
         date.getDate() === now.getDate();
}

// ── API ──
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${authToken}`
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ── AUTH ──
async function login() {
  const pw = document.getElementById('login-password').value.trim();
  if (!pw) return;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true;
  err.style.display = 'none';

  try {
    // Try manager password
    const res = await fetch('/api/owner-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    // If owner login fails, validate as manager (just store the pw)
    // We'll validate by calling an authenticated endpoint
    authToken = pw;
    sessionStorage.setItem('mgr_token', pw);
    await initApp();
  } catch (e) {
    err.style.display = 'block';
    authToken = '';
    sessionStorage.removeItem('mgr_token');
  }
  btn.disabled = false;
}

async function initApp() {
  // Validate auth by fetching employees
  try {
    employees = await api('GET', '/api/employees');
  } catch (e) {
    document.getElementById('login-error').style.display = 'block';
    authToken = '';
    sessionStorage.removeItem('mgr_token');
    return;
  }

  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('stats-bar').classList.remove('hidden');
  document.getElementById('schedule-wrapper').classList.remove('hidden');

  renderColorPicker();
  await loadWeek();
}

// ── WEEK NAVIGATION ──
function updateWeekLabel() {
  const end = addDays(currentWeekStart, 6);
  document.getElementById('week-label').textContent =
    `${fmtDate(currentWeekStart)} – ${fmtDate(end)}`;
}

async function loadWeek() {
  updateWeekLabel();
  try {
    shifts = await api('GET', `/api/shifts?week_start=${toDateStr(currentWeekStart)}`);
  } catch (e) {
    shifts = [];
  }
  renderGrid();
}

document.getElementById('prev-week').addEventListener('click', () => {
  currentWeekStart = addDays(currentWeekStart, -7);
  loadWeek();
});

document.getElementById('next-week').addEventListener('click', () => {
  currentWeekStart = addDays(currentWeekStart, 7);
  loadWeek();
});

// ── STATS ──
function calcStats() {
  let totalCost = 0, totalHours = 0;
  for (const s of shifts) {
    const h = shiftHours(s);
    const rate = s.employees?.hourly_rate || 0;
    totalHours += h;
    totalCost += h * rate;
  }
  document.getElementById('stat-cost').textContent = `$${totalCost.toFixed(2)}`;
  document.getElementById('stat-hours').textContent = `${totalHours.toFixed(1)}h`;
  document.getElementById('stat-shifts').textContent = shifts.length;
}

// ── SCHEDULE GRID ──
function renderGrid() {
  calcStats();
  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = '';

  const days = Array.from({ length: 7 }, (_, i) => addDays(currentWeekStart, i));

  // Corner cell
  const corner = document.createElement('div');
  corner.className = 'grid-corner';
  corner.textContent = 'STAFF';
  grid.appendChild(corner);

  // Day headers
  for (const day of days) {
    const dayShifts = shifts.filter(s => {
      const d = new Date(s.start_ts);
      return d.toDateString() === day.toDateString();
    });
    const dayHours = dayShifts.reduce((acc, s) => acc + shiftHours(s), 0);
    const dayCost = dayShifts.reduce((acc, s) => acc + shiftHours(s) * (s.employees?.hourly_rate || 0), 0);

    const header = document.createElement('div');
    header.className = 'day-header';
    const dayIdx = day.getDay() === 0 ? 6 : day.getDay() - 1;
    header.innerHTML = `
      <div class="day-name">${DAYS[dayIdx]}</div>
      <div class="day-num${isToday(day) ? ' today' : ''}">${day.getDate()}</div>
      <div class="day-stats">${dayHours.toFixed(1)}h · $${dayCost.toFixed(0)}</div>
    `;
    grid.appendChild(header);
  }

  // Employee rows
  for (const emp of employees) {
    // Employee cell
    const empCell = document.createElement('div');
    empCell.className = 'emp-cell';

    const empColor = emp.color || getRoleColor(emp.role);
    const empShifts = shifts.filter(s => s.employee_id === emp.id);
    const empHours = empShifts.reduce((acc, s) => acc + shiftHours(s), 0);
    const empCost = empHours * (emp.hourly_rate || 0);

    empCell.innerHTML = `
      <div class="emp-avatar" style="background:${empColor};">${getInitials(emp.name)}</div>
      <div class="emp-info">
        <div class="emp-name">${emp.name}</div>
        <div class="emp-role">${emp.role}</div>
        <div class="emp-week-stats">${empHours.toFixed(1)}h · $${empCost.toFixed(0)}</div>
      </div>
    `;
    grid.appendChild(empCell);

    // Shift cells for each day
    for (const day of days) {
      const cell = document.createElement('div');
      cell.className = 'shift-cell';

      const dayShifts = empShifts.filter(s => {
        const d = new Date(s.start_ts);
        return d.toDateString() === day.toDateString();
      });

      for (const shift of dayShifts) {
        const block = document.createElement('div');
        block.className = 'shift-block';
        block.style.background = empColor;
        block.innerHTML = `
          <div class="shift-time">${fmtTime(shift.start_ts)}–${fmtTime(shift.end_ts)}</div>
          ${shift.notes ? `<div class="shift-notes">${shift.notes}</div>` : ''}
        `;
        block.addEventListener('click', (e) => {
          e.stopPropagation();
          openShiftModal(emp, day, shift);
        });
        cell.appendChild(block);
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+';
      addBtn.title = 'Add shift';
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openShiftModal(emp, day, null);
      });
      cell.appendChild(addBtn);

      cell.addEventListener('dblclick', () => openShiftModal(emp, day, null));
      grid.appendChild(cell);
    }
  }

  if (employees.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'grid-column:1/-1;padding:48px;text-align:center;color:var(--text-muted);font-family:var(--mono);font-size:13px;';
    empty.textContent = 'No employees yet. Add staff to get started.';
    grid.appendChild(empty);
  }
}

// ── TIME OPTIONS ──
function buildTimeOptions(selectEl, selectedVal) {
  selectEl.innerHTML = '';
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 15) {
      const totalMin = h * 60 + m;
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      const label = `${h12}:${m.toString().padStart(2,'0')}${ampm}`;
      const opt = document.createElement('option');
      opt.value = totalMin;
      opt.textContent = label;
      if (selectedVal !== undefined && selectedVal === totalMin) opt.selected = true;
      selectEl.appendChild(opt);
    }
  }
}

function tsToMinutes(ts) {
  const d = new Date(ts);
  return d.getHours() * 60 + d.getMinutes();
}

function buildTs(date, minutes) {
  const d = new Date(date);
  d.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
  return d.toISOString();
}

// ── SHIFT MODAL ──
function openShiftModal(emp, day, existingShift) {
  document.getElementById('shift-emp-display').value = emp.name;
  document.getElementById('shift-employee-id').value = emp.id;
  document.getElementById('shift-date').value = day.toISOString();
  document.getElementById('shift-date-display').value = fmtDateFull(day);
  document.getElementById('shift-error').style.display = 'none';

  const startSel = document.getElementById('shift-start');
  const endSel = document.getElementById('shift-end');

  if (existingShift) {
    document.getElementById('shift-modal-title').textContent = 'Edit Shift';
    document.getElementById('shift-id').value = existingShift.id;
    document.getElementById('shift-notes').value = existingShift.notes || '';
    document.getElementById('delete-shift-btn').classList.remove('hidden');
    buildTimeOptions(startSel, tsToMinutes(existingShift.start_ts));
    buildTimeOptions(endSel, tsToMinutes(existingShift.end_ts));
  } else {
    document.getElementById('shift-modal-title').textContent = 'Add Shift';
    document.getElementById('shift-id').value = '';
    document.getElementById('shift-notes').value = '';
    document.getElementById('delete-shift-btn').classList.add('hidden');
    buildTimeOptions(startSel, 9 * 60); // default 9am
    buildTimeOptions(endSel, 17 * 60);  // default 5pm
  }

  document.getElementById('shift-modal-overlay').classList.remove('hidden');
}

document.getElementById('cancel-shift-btn').addEventListener('click', closeShiftModal);
document.getElementById('shift-modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('shift-modal-overlay')) closeShiftModal();
});

function closeShiftModal() {
  document.getElementById('shift-modal-overlay').classList.add('hidden');
}

document.getElementById('save-shift-btn').addEventListener('click', async () => {
  const shiftId = document.getElementById('shift-id').value;
  const employeeId = document.getElementById('shift-employee-id').value;
  const dateTsStr = document.getElementById('shift-date').value;
  const startMin = parseInt(document.getElementById('shift-start').value);
  const endMin = parseInt(document.getElementById('shift-end').value);
  const notes = document.getElementById('shift-notes').value.trim();
  const errEl = document.getElementById('shift-error');

  errEl.style.display = 'none';

  if (endMin <= startMin) {
    errEl.textContent = 'End time must be after start time';
    errEl.style.display = 'block';
    return;
  }

  const date = new Date(dateTsStr);
  const start_ts = buildTs(date, startMin);
  const end_ts = buildTs(date, endMin);

  const btn = document.getElementById('save-shift-btn');
  btn.disabled = true;

  try {
    if (shiftId) {
      // Edit = delete + recreate (simplest approach)
      await api('DELETE', `/api/shifts/${shiftId}`);
      await api('POST', '/api/shifts', { employee_id: employeeId, start_ts, end_ts, notes: notes || null });
    } else {
      await api('POST', '/api/shifts', { employee_id: employeeId, start_ts, end_ts, notes: notes || null });
    }
    closeShiftModal();
    await loadWeek();
    showToast('Shift saved');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
  btn.disabled = false;
});

document.getElementById('delete-shift-btn').addEventListener('click', async () => {
  const shiftId = document.getElementById('shift-id').value;
  if (!shiftId) return;
  if (!confirm('Delete this shift?')) return;
  try {
    await api('DELETE', `/api/shifts/${shiftId}`);
    closeShiftModal();
    await loadWeek();
    showToast('Shift deleted');
  } catch (e) {
    document.getElementById('shift-error').textContent = e.message;
    document.getElementById('shift-error').style.display = 'block';
  }
});

// ── STAFF DRAWER ──
document.getElementById('manage-staff-btn').addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

function openDrawer() {
  document.getElementById('drawer-overlay').classList.remove('hidden');
  document.getElementById('staff-drawer').classList.add('open');
  renderStaffList();
  resetEmpForm();
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.add('hidden');
  document.getElementById('staff-drawer').classList.remove('open');
}

function renderStaffList() {
  const list = document.getElementById('staff-list');
  list.innerHTML = '';
  if (employees.length === 0) {
    list.innerHTML = '<div style="font-family:var(--mono);font-size:12px;color:var(--text-muted);padding:8px 0;">No employees yet</div>';
    return;
  }
  for (const emp of employees) {
    const item = document.createElement('div');
    item.className = 'staff-item';
    const empColor = emp.color || getRoleColor(emp.role);
    item.innerHTML = `
      <div class="emp-avatar" style="background:${empColor};width:30px;height:30px;font-size:11px;">${getInitials(emp.name)}</div>
      <div class="staff-item-info">
        <div class="staff-item-name">${emp.name}</div>
        <div class="staff-item-sub">${emp.role} · PIN: ${emp.employee_code} · $${Number(emp.hourly_rate).toFixed(2)}/hr</div>
      </div>
      <div class="staff-item-actions">
        <button class="icon-btn" data-edit="${emp.id}">edit</button>
        <button class="icon-btn danger" data-delete="${emp.id}">del</button>
      </div>
    `;
    item.querySelector('[data-edit]').addEventListener('click', () => startEditEmp(emp));
    item.querySelector('[data-delete]').addEventListener('click', () => deleteEmp(emp));
    list.appendChild(item);
  }
}

function renderColorPicker() {
  const container = document.getElementById('color-options');
  container.innerHTML = '';
  for (const color of COLORS) {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (color === selectedColor ? ' selected' : '');
    dot.style.background = color;
    dot.addEventListener('click', () => {
      selectedColor = color;
      container.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
    });
    container.appendChild(dot);
  }
}

function resetEmpForm() {
  document.getElementById('edit-emp-id').value = '';
  document.getElementById('emp-name').value = '';
  document.getElementById('emp-role').value = 'server';
  document.getElementById('emp-rate').value = '';
  document.getElementById('emp-pin').value = '';
  document.getElementById('emp-phone').value = '';
  document.getElementById('emp-error').style.display = 'none';
  document.getElementById('emp-form-label').textContent = 'Add Employee';
  document.getElementById('cancel-edit-btn').classList.add('hidden');
  selectedColor = COLORS[0];
  renderColorPicker();
}

function startEditEmp(emp) {
  document.getElementById('edit-emp-id').value = emp.id;
  document.getElementById('emp-name').value = emp.name;
  document.getElementById('emp-role').value = emp.role;
  document.getElementById('emp-rate').value = emp.hourly_rate;
  document.getElementById('emp-pin').value = emp.employee_code;
  document.getElementById('emp-phone').value = emp.phone || '';
  document.getElementById('emp-form-label').textContent = 'Edit Employee';
  document.getElementById('cancel-edit-btn').classList.remove('hidden');
  selectedColor = emp.color || COLORS[0];
  renderColorPicker();
  document.getElementById('emp-name').focus();
}

document.getElementById('cancel-edit-btn').addEventListener('click', resetEmpForm);

document.getElementById('save-emp-btn').addEventListener('click', async () => {
  const empId = document.getElementById('edit-emp-id').value;
  const name = document.getElementById('emp-name').value.trim();
  const role = document.getElementById('emp-role').value;
  const hourly_rate = parseFloat(document.getElementById('emp-rate').value) || 0;
  const employee_code = document.getElementById('emp-pin').value.trim();
  const phone = document.getElementById('emp-phone').value.trim();
  const errEl = document.getElementById('emp-error');

  errEl.style.display = 'none';

  if (!name || !employee_code) {
    errEl.textContent = 'Name and PIN are required';
    errEl.style.display = 'block';
    return;
  }

  if (!/^\d{4}$/.test(employee_code)) {
    errEl.textContent = 'PIN must be exactly 4 digits';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('save-emp-btn');
  btn.disabled = true;

  try {
    const payload = { name, role, hourly_rate, employee_code, phone: phone || null, color: selectedColor };
    if (empId) {
      await api('PATCH', `/api/employees/${empId}`, payload);
      showToast('Employee updated');
    } else {
      await api('POST', '/api/employees', payload);
      showToast('Employee added');
    }
    employees = await api('GET', '/api/employees');
    renderStaffList();
    renderGrid();
    resetEmpForm();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
  btn.disabled = false;
});

async function deleteEmp(emp) {
  if (!confirm(`Remove ${emp.name}? Their shifts will be deleted.`)) return;
  try {
    await api('DELETE', `/api/employees/${emp.id}`);
    employees = await api('GET', '/api/employees');
    renderStaffList();
    renderGrid();
    showToast('Employee removed');
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// ── PUBLISH MODAL ──
document.getElementById('publish-btn').addEventListener('click', openPublishModal);
document.getElementById('cancel-publish-btn').addEventListener('click', closePublishModal);
document.getElementById('publish-modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('publish-modal-overlay')) closePublishModal();
});

function closePublishModal() {
  document.getElementById('publish-modal-overlay').classList.add('hidden');
}

function buildScheduleMessage(emp, empShifts) {
  const weekEnd = addDays(currentWeekStart, 6);
  let msg = `GCDC Schedule: ${fmtDate(currentWeekStart)}–${fmtDate(weekEnd)}\n`;
  msg += `Hi ${emp.name.split(' ')[0]}!\n\n`;

  const sorted = [...empShifts].sort((a, b) => new Date(a.start_ts) - new Date(b.start_ts));
  if (sorted.length === 0) {
    msg += 'No shifts scheduled this week.';
  } else {
    for (const s of sorted) {
      const d = new Date(s.start_ts);
      const dayIdx = d.getDay() === 0 ? 6 : d.getDay() - 1;
      msg += `${DAYS[dayIdx]} ${d.getDate()}: ${fmtTime(s.start_ts)}–${fmtTime(s.end_ts)}`;
      if (s.notes) msg += ` (${s.notes})`;
      msg += '\n';
    }
  }
  return msg.trim();
}

function openPublishModal() {
  const list = document.getElementById('publish-list');
  list.innerHTML = '';
  document.getElementById('publish-error').style.display = 'none';
  document.getElementById('send-publish-btn').disabled = false;
  document.getElementById('send-publish-btn').textContent = 'Send SMS';

  for (const emp of employees) {
    const empShifts = shifts.filter(s => s.employee_id === emp.id);
    const preview = buildScheduleMessage(emp, empShifts);

    const row = document.createElement('div');
    row.className = 'publish-employee-row';
    row.innerHTML = `
      <div class="publish-emp-info">
        <div class="publish-emp-name">${emp.name}</div>
        <div class="publish-emp-phone">${emp.phone || 'No phone number'}</div>
        <div class="publish-emp-preview" style="white-space:pre-line;">${preview}</div>
      </div>
      <div class="publish-status ${emp.phone ? '' : 'no-phone'}" id="pub-status-${emp.id}">
        ${emp.phone ? 'pending' : 'no phone'}
      </div>
    `;
    list.appendChild(row);
  }

  document.getElementById('publish-modal-overlay').classList.remove('hidden');
}

document.getElementById('send-publish-btn').addEventListener('click', async () => {
  const btn = document.getElementById('send-publish-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const messages = [];
  for (const emp of employees) {
    if (!emp.phone) continue;
    const empShifts = shifts.filter(s => s.employee_id === emp.id);
    messages.push({ to: emp.phone, body: buildScheduleMessage(emp, empShifts) });
  }

  if (messages.length === 0) {
    document.getElementById('publish-error').textContent = 'No employees have phone numbers';
    document.getElementById('publish-error').style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send SMS';
    return;
  }

  try {
    const result = await api('POST', '/api/send-schedule', {
      messages,
      fromWeekStart: toDateStr(currentWeekStart)
    });

    for (const r of result.results) {
      const emp = employees.find(e => e.phone === r.to);
      if (!emp) continue;
      const statusEl = document.getElementById(`pub-status-${emp.id}`);
      if (statusEl) {
        statusEl.textContent = r.status;
        statusEl.className = `publish-status ${r.status}`;
      }
    }
    showToast('Schedule sent!');
  } catch (e) {
    document.getElementById('publish-error').textContent = e.message;
    document.getElementById('publish-error').style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Send SMS';
});

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

];

function makeDemoShifts(weekStart) {
  const s = [];
  const patterns = [
    { empId: 'demo-1', days: [0,1,3,4],   start: 8,  end: 16 },
    { empId: 'demo-2', days: [0,2,4,5,6], start: 11, end: 19 },
    { empId: 'demo-3', days: [1,2,3,5,6], start: 9,  end: 17 },
    { empId: 'demo-4', days: [0,3,4,5],   start: 10, end: 18 },
    { empId: 'demo-5', days: [1,2,3,6],   start: 6,  end: 14 },
  ];
  let idN = 0;
  for (const p of patterns) {
    for (const d of p.days) {
      const day = new Date(weekStart);
      day.setDate(day.getDate() + d);
      const start = new Date(day); start.setHours(p.start, 0, 0, 0);
      const end   = new Date(day); end.setHours(p.end,   0, 0, 0);
      const emp = DEMO_EMPLOYEES.find(e => e.id === p.empId);
      s.push({
        id: `demo-shift-${idN++}`,
        employee_id: p.empId,
        start_ts: start.toISOString(),
        end_ts:   end.toISOString(),
        notes: null,
        employees: emp
      });
    }
  }
  return s;
}

function enterDemoMode() {
  authToken = 'demo';
  employees = DEMO_EMPLOYEES;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-header').classList.remove('hidden');
  document.getElementById('stats-bar').classList.remove('hidden');
  document.getElementById('schedule-wrapper').classList.remove('hidden');
  renderColorPicker();
  shifts = makeDemoShifts(currentWeekStart);
  renderGrid();
  updateWeekLabel();
  showToast('Demo mode — changes are not saved');
}

// Patch week navigation for demo mode
const _loadWeek = loadWeek;
async function loadWeek() {
  if (authToken === 'demo') {
    updateWeekLabel();
    shifts = makeDemoShifts(currentWeekStart);
    renderGrid();
    return;
  }
  return _loadWeek();
}
